name: Agent loop iteration
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Opt-in PR to process once
        type: string
        required: true
      source_head_sha:
        description: HEAD observed by dispatcher (empty for manual reconciliation)
        type: string
        required: false
      source_event:
        description: Originating event
        type: string
        required: false
# This lock spans all fresh jobs in the one iteration.
concurrency:
  group: agent-loop-pr-${{ inputs.pr_number }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
  pull-requests: read
env:
  PR_NUMBER: ${{ inputs.pr_number }}
  CODEX_REVIEW_LOGIN: ${{ vars.CODEX_REVIEW_LOGIN }}
  CODEX_REVIEW_USER_ID: ${{ vars.CODEX_REVIEW_USER_ID }}
  CODEX_REVIEW_APP_ID: ${{ vars.CODEX_REVIEW_APP_ID }}
  MAX_AGENT_ITERATIONS: ${{ vars.MAX_AGENT_ITERATIONS || '5' }}
  AGENT_LOOP_REVIEW_REQUEST_MODE: ${{ vars.AGENT_LOOP_REVIEW_REQUEST_MODE || 'comment-fallback' }}
  REVIEW_START_GRACE_PERIOD_SECONDS: ${{ vars.REVIEW_START_GRACE_PERIOD_SECONDS || '420' }}
  LOOP_DIR: ${{ github.workspace }}/loop
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - id: plan
        run: node controller/scripts/agent-loop/run.mjs plan
        env:
          GH_TOKEN: ${{ github.token }}
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loop-plan
          path: loop/
  analyze:
    needs: plan
    if: needs.plan.outputs.mode == 'analyze'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          persist-credentials: false
          path: work
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          merge-multiple: true
          path: loop/
      # Last step: only action output crosses to a fresh runner.
      - id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          codex-version: '0.154.0'
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/work
          prompt-file: ${{ github.workspace }}/loop/analyze.txt
          output-schema-file: ${{ github.workspace }}/controller/scripts/agent-loop/analysis.schema.json
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-bots: true
  decide:
    needs: [plan, analyze]
    if: needs.plan.outputs.mode == 'analyze'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          merge-multiple: true
          path: loop/
      - id: decide
        run: node controller/scripts/agent-loop/run.mjs decide
        env:
          GH_TOKEN: ${{ github.token }}
          ANALYSIS_RESULT: ${{ needs.analyze.outputs.result }}
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loop-decided
          path: loop/
  fix:
    needs: [plan, decide]
    if: needs.decide.outputs.mode == 'fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          persist-credentials: false
          path: work
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.decide.outputs.artifact_id }}
          merge-multiple: true
          path: loop/
      # Never execute PR install hooks on the secret-bearing Codex runner.
      # Dependencies and all package scripts run only in fresh validation.
      - id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          codex-version: '0.154.0'
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: ${{ github.workspace }}/work
          prompt-file: ${{ github.workspace }}/loop/fix.txt
          output-schema-file: ${{ github.workspace }}/controller/scripts/agent-loop/fix.schema.json
          sandbox: workspace-write
          safety-strategy: drop-sudo
          allow-bots: true
  candidate:
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    needs: [decide, fix]
    if: >-
      always() && needs.decide.result == 'success' &&
      (needs.decide.outputs.mode == 'clean' ||
      (needs.decide.outputs.mode == 'fix' && needs.fix.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.decide.outputs.artifact_id }}
          merge-multiple: true
          path: loop/
      - name: Package patch and enter VALIDATING
        run: node controller/scripts/agent-loop/run.mjs candidate
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_RESULT: ${{ needs.fix.outputs.result }}
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loop-candidate
          path: loop/candidate.json
  validate:
    outputs:
      failure_kind: ${{ steps.materialize.outputs.failure_kind }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    needs: [plan, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          persist-credentials: false
          path: work
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          merge-multiple: true
          path: loop/
      - id: materialize
        run: node controller/scripts/agent-loop/run.mjs materialize
      - name: Validate candidate on a fresh runner
        working-directory: work
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run lint
          npm run typecheck
          npm run test
          npm run test:release
          npm run build
          npm run test:browser
      - name: Attest exact candidate tree
        run: node controller/scripts/agent-loop/run.mjs attest
      - id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loop-validated
          path: loop/validated.json
  publish:
    outputs:
      failure_kind: ${{ steps.publish.outputs.failure_kind }}
    needs: [plan, candidate, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.head_sha }}
          persist-credentials: false
          path: work
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact_id }}
          merge-multiple: true
          path: loop/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          merge-multiple: true
          path: loop/
      # No package scripts or PR code run on this credential-bearing runner.
      - id: publish
        run: node controller/scripts/agent-loop/run.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_LOOP_TOKEN: ${{ secrets.AGENT_LOOP_TOKEN }}
  certify:
    needs: plan
    if: needs.plan.outputs.mode == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          merge-multiple: true
          path: loop/
      - run: node controller/scripts/agent-loop/run.mjs certify
        env:
          GH_TOKEN: ${{ github.token }}
  failure:
    needs: [plan, analyze, decide, fix, candidate, validate, publish, certify]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node controller/scripts/agent-loop/run.mjs failed
        env:
          FAILURE_KIND: ${{ needs.validate.outputs.failure_kind || needs.publish.outputs.failure_kind }}
          GH_TOKEN: ${{ github.token }}
