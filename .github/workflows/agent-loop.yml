name: Agent loop events
on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review, converted_to_draft, closed, edited]
  workflow_run:
    workflows: [Validate plugin]
    types: [completed]
  check_run:
    types: [created, completed, rerequested]
  check_suite:
    types: [completed]
  status:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR to reconcile (empty checks eligible waiting/ready PRs)
        type: string
        required: false
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          path: controller
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve current PR and enqueue one iteration
        run: |
          if test -f controller/scripts/agent-loop/service.mjs; then
            node controller/scripts/agent-loop/run.mjs dispatch
          else
            echo 'Controller is awaiting human merge to the default branch.'
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_REVIEW_LOGIN: ${{ vars.CODEX_REVIEW_LOGIN }}
          CODEX_REVIEW_USER_ID: ${{ vars.CODEX_REVIEW_USER_ID }}
          CODEX_REVIEW_APP_ID: ${{ vars.CODEX_REVIEW_APP_ID }}
